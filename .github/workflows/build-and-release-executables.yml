name: build-and-release-executables.yml

on:
  push:
    tags:
      - 'v*' # Trigger on version tags

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            python-version: 3.13
            artifact-name: PlexFileOrganizer-linux
            pyinstaller-args: --windowed

          - os: macos-latest
            platform: macos
            python-version: 3.13
            artifact-name: PlexFileOrganizer-macos
            pyinstaller-args: --windowed

          - os: windows-latest
            platform: windows
            python-version: 3.13
            artifact-name: PlexFileOrganizer-windows
            pyinstaller-args: --windowed

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable with PyInstaller
      run: |
        pyinstaller ${{ matrix.pyinstaller-args }} \
          --name "${{ matrix.artifact-name }}" \
          main.py

    - name: Gather build file
      id: gather
      run: |
        if [[ "${{ matrix.platform }}" == "windows" ]]; then
        BINARY="dist/${{ matrix.artifact-name }}.exe"
        else
        BINARY="dist/${{ matrix.artifact-name }}/${{ matrix.artifact-name }}"
        fi
        echo "binary_path=$BINARY" >> $GITHUB_OUTPUT

    - name: Create (or update) release & upload asset
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: ${{ steps.gather.outputs.binary_path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
