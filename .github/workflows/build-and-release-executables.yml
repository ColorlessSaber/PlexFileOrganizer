name: build-and-release-executables.yml

on:
  push:
    tags:
      - 'v*' # Trigger on version tags

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            python-version: 3.13
            artifact-name: PlexFileOrganizer-linux
            pyinstaller-args: --windowed

          - os: macos-latest
            platform: macos
            python-version: 3.13
            artifact-name: PlexFileOrganizer-macos
            pyinstaller-args: --windowed

          - os: windows-latest
            platform: windows
            python-version: 3.13
            artifact-name: PlexFileOrganizer-windows
            pyinstaller-args: --windowed

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable with PyInstaller
      run: |
        pyinstaller ${{ matrix.pyinstaller-args }} \
          --name "${{ matrix.artifact-name }}" \
          main.py

    - name: Create distribution folder
      run: |
        mkdir -p dist/${{ matrix.artifact-name }}
        if [ "${{ matrix.platform }}" != "windows" ]; then
          mv dist/${{ matrix.artifact-name }} dist/${{ matrix.artifact-name }}/
        fi
        if [ "${{ matrix.platform }}" == "windows" ]; then
          mkdir -p dist/${{ matrix.artifact-name }}
          mv "dist/${{ matrix.artifact-name }}.exe" "dist/${{ matrix.artifact-name }}/"
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v6.0.0
      with:
        name: ${{ matrix.artifact-name }}
        path: dist/${{ matrix.artifact-name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v6.0.0

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          PlexFileOrganizer-linux/PlexFileOrganizer-linux
          PlexFileOrganizer-macos/PlexFileOrganizer-macos
          PlexFileOrganizer-windows/PlexFileOrganizer-windows.exe
